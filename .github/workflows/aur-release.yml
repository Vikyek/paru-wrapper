name: AUR Package CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Git and Base Dependencies
        run: |
          pacman -Syu --noconfirm git sudo namcap diffutils pacman-contrib

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup non-root builder
        run: |
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: /usr/bin/pacman" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Validate tag version matches PKGBUILD pkgver
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(grep -Po '^pkgver=\K.*' PKGBUILD)
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "ERROR: Tag version (v$TAG_VER) does not match PKGBUILD pkgver ($PKG_VER)."
            exit 1
          fi

      - name: Verify .SRCINFO is in sync
        run: |
          sudo -u builder makepkg --printsrcinfo > .SRCINFO.ci
          if ! diff -u .SRCINFO .SRCINFO.ci; then
            echo "ERROR: .SRCINFO is out of sync with PKGBUILD."
            exit 1
          fi

      - name: Validate PKGBUILD with namcap
        run: |
          namcap PKGBUILD

      - name: Install AUR dependencies (paru-bin)
        run: |
          sudo -u builder bash -c '
            cd /tmp
            git clone https://aur.archlinux.org/paru-bin.git
            cd paru-bin
            git checkout 92a55429afbec4fceeb2cef843245105307444d2
            makepkg -si --noconfirm
          '

      - name: Build Package
        run: |
          sudo -u builder makepkg -s --noconfirm

      - name: Validate Built Package
        run: |
          namcap *.pkg.tar.zst

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-package
          path: "*.pkg.tar.zst"
          retention-days: 7

  publish-aur-and-release:
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-package
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: paru-wrapper
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
