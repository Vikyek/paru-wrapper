name: AUR Release Workflow

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install git and sudo
        run: pacman -Syu --noconfirm git sudo diffutils namcap

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup builder user
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder $GITHUB_WORKSPACE

      - name: Install paru (dependency)
        run: |
          su builder -c "git clone https://aur.archlinux.org/paru-bin.git /tmp/paru-bin"
          su builder -c "cd /tmp/paru-bin && makepkg -si --noconfirm"

      - name: Verify .SRCINFO is up-to-date
        run: |
          su builder -c "makepkg --printsrcinfo > .SRCINFO.new"
          if ! diff .SRCINFO .SRCINFO.new; then
            echo ".SRCINFO is out of date. Please run 'makepkg --printsrcinfo > .SRCINFO' locally and commit the changes."
            exit 1
          fi

      - name: Validate PKGBUILD with namcap
        run: su builder -c "namcap PKGBUILD"

      - name: Build package
        run: su builder -c "makepkg -s --noconfirm"

      - name: Validate built package with namcap
        run: su builder -c "namcap *.pkg.tar.zst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paru-wrapper-package
          path: "*.pkg.tar.zst"

  release:
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: paru-wrapper-package
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pkg.tar.zst

  publish-aur:
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: paru-wrapper
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519
