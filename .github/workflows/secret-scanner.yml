name: 🔐 Secret Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  secrets:
    name: Detect Secrets & Credentials
    runs-on: ubuntu-latest

    steps:
      # Bumped to v5 to resolve the Node 20 deprecation warning
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check git diff for secrets
        id: check-diff
        run: |
          # Exclude the security scripts and workflow file themselves from the diff scan
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude).github/workflows/" || git diff HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude).github/workflows/")
          else
            DIFF=$(git diff HEAD~1 HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude).github/workflows/" || git diff HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude).github/workflows/")
          fi

          if echo "$DIFF" | grep -qEi '(BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|GITHUB_TOKEN\s*=|api_key\s*=|AKIA[0-9A-Z]{16}|aws_secret_access_key|firebase_key|stripe_secret)'; then
            echo "found_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "found_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR if secrets found
        if: github.event_name == 'pull_request' && steps.check-diff.outputs.found_secrets == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **Security Alert: Potential Secrets Detected**\n\nPlease remove secrets from this PR, rotate compromised credentials, and use `git filter-repo` to remove from history.'
            })

      - name: Fail if secrets detected
        if: steps.check-diff.outputs.found_secrets == 'true'
        run: exit 1
