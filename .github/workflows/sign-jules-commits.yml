name: Sign Jules Commits

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  sign:
    # Match Jules bot actors or Jules branch naming conventions
    if: github.actor == 'google-jules[bot]' || startsWith(github.head_ref, 'jules') || startsWith(github.head_ref, 'bolt-') || startsWith(github.head_ref, 'prism/') || startsWith(github.head_ref, 'sentinel-') || startsWith(github.head_ref, 'archivist-') || contains(github.event.pull_request.body, 'Jules')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG Key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Re-sign Commits on Branch
        run: |
          git config --global user.name "${{ steps.import-gpg.outputs.name }}"
          git config --global user.email "${{ steps.import-gpg.outputs.email }}"

          # Identify base branch divergence point
          BASE_SHA=$(git merge-base origin/${{ github.base_ref }} HEAD)

          # Re-apply commit signatures across PR history
          git rebase --exec "git commit --amend --no-edit -S --allow-empty" $BASE_SHA

          # Push re-signed commits back to Jules' PR branch
          git push --force-with-lease origin HEAD:${{ github.head_ref }} || true
